# Lead Portal — which colour slot is live.
#
# Install to /etc/nginx/conf.d/lead-portal-upstream.conf.
#
# deploy/deploy.sh REWRITES this file and reloads nginx. That reload is what
# makes a deploy zero-downtime: nginx starts new connections against the new
# port while in-flight requests finish on the old worker, so no request is
# dropped and no request is refused.
#
# Ports: blue = 3001, green = 3002. Nothing listens on 3000 — leaving the
# obvious port empty makes it harder to hit an app instance by accident.
#
# The line below is the initial state; treat the deployed copy as generated.

upstream lead_portal {
    server 127.0.0.1:3001;   # blue

    # Reuse connections to Node instead of reconnecting per request.
    keepalive 32;
}
