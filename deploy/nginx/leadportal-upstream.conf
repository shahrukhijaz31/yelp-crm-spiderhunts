# Lead Portal — which colour slot is live.
# /etc/nginx/conf.d/leadportal-upstream.conf
#
# REWRITTEN by deploy/deploy.sh on every deploy, then `systemctl reload nginx`.
# That reload is what makes a deploy zero-downtime: nginx opens new connections
# against the new port while in-flight requests finish on the old worker.
#
# The upstream name is `leadportal_upstream`, not something generic, because
# this file sits in conf.d/ inside the shared `http` block alongside every other
# site on this server — a generic name would be a collision waiting to happen.
#
# Ports 3031 / 3032 were chosen because 3000, 3001, 3010, 3020 and 3030 are all
# already taken by other apps on this box.

upstream leadportal_upstream {
    server 127.0.0.1:3031;   # blue
    keepalive 32;
}
