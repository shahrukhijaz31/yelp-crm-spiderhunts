# Lead Portal — nginx vhost.
#
# Install to /etc/nginx/sites-available/lead-portal and symlink into
# sites-enabled. The upstream lives in its own file (lead-portal-upstream.conf)
# because deploy.sh rewrites it on every deploy to point at the new colour slot;
# keeping it separate means the deploy never edits this file.
#
# Served on the bare IP 169.58.34.205 — no domain yet, so:
#   * Let's Encrypt cannot issue a certificate (it does not do bare IPs), hence
#     the self-signed pair below. Browsers will warn once and can be accepted.
#   * The point of TLS here is not identity, it is that HTTP Basic Auth sends
#     the password base64-encoded, which over plain HTTP is the same as sending
#     it in the clear. Self-signed still encrypts the transport.
#   * See deploy/README.md for the three-line switch to Let's Encrypt the day a
#     domain is pointed at this box.

# --- HTTP: redirect everything to HTTPS ------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # No ACME challenge location: there is no domain to validate yet. Add the
    # /.well-known/acme-challenge/ block from deploy/README.md when there is.
    return 301 https://$host$request_uri;
}

# --- HTTPS: the application ------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/lead-portal/fullchain.pem;
    ssl_certificate_key /etc/ssl/lead-portal/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Access control ----------------------------------------------------
    # The application has no authentication of its own, and POST
    # /api/leads/upload deletes every row before inserting. Without this block,
    # anyone who finds the IP can destroy the lead database with one curl.
    # This is a stopgap at the edge, not a substitute for real auth.
    auth_basic           "Lead Portal";
    auth_basic_user_file /etc/nginx/lead-portal.htpasswd;

    # --- Security headers --------------------------------------------------
    # Set here rather than in next.config.ts so there is one place to audit,
    # and so they cover error pages nginx generates itself.
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "DENY"               always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"      always;

    # HSTS is deliberately OFF while the certificate is self-signed. Turning it
    # on would pin browsers to HTTPS for this IP for the max-age duration, and
    # with an untrusted cert that is an outage you cannot click through. Enable
    # it the moment a real certificate is installed:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Next.js ships inline bootstrap scripts and next/font injects inline CSS,
    # so 'unsafe-inline' is required unless you add a nonce-emitting proxy.
    # 'unsafe-eval' is NOT included — nothing in this app needs it. Fonts are
    # self-hosted by next/font, so no external font origin is allowed either.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Compression -------------------------------------------------------
    # next.config.ts sets compress:false precisely so this is the only place
    # compression happens. text/html is always compressed by nginx and is not
    # listed here (listing it is an error).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript image/svg+xml
               application/manifest+json;

    # --- Body size ---------------------------------------------------------
    # app/api/leads/upload/route.ts rejects anything over 8MB with a JSON 413.
    # This is set higher so that limit is the one that fires: nginx cutting the
    # request first would give the agent an nginx error page instead of the
    # app's message about the file being too large.
    client_max_body_size 12M;
    client_body_timeout  120s;

    # --- Static assets -----------------------------------------------------
    # Content-hashed filenames, so they can be cached forever. Next already
    # sends immutable Cache-Control; this adds nginx-side caching of the
    # upstream response so repeat requests never wake the Node process.
    location /_next/static/ {
        proxy_pass http://lead_portal;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Static assets carry no data — requiring a password for them only
        # breaks caching and gains nothing, since the filenames are opaque.
        auth_basic off;
    }

    # --- Health check ------------------------------------------------------
    # Exempt from Basic Auth: deploy.sh polls this before flipping traffic, and
    # an uptime monitor needs it too. It returns only up/down.
    location = /api/health {
        proxy_pass http://lead_portal;
        auth_basic off;
        access_log off;
    }

    # --- Everything else ---------------------------------------------------
    location / {
        proxy_pass http://lead_portal;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Keepalive to the upstream: without these two lines every proxied
        # request opens a new TCP connection to Node.
        proxy_set_header Connection "";

        # A CSV import parses and writes the whole file inside one request.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Never serve a cached copy of a page that reflects lead state.
        proxy_buffering on;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
