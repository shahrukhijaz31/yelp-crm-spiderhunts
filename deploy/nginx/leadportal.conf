# Lead Portal — nginx vhost.  /etc/nginx/sites-available/leadportal
#
# This server hosts ~10 sites behind one nginx. Everything here is scoped to a
# single hostname and nothing is shared, so this file cannot affect the others:
#
#   * NO `default_server`. Nothing currently claims default on :80/:443 (only
#     bvr-preview.conf, on :8095). Taking it would silently capture every
#     request for every hostname that matches no other vhost.
#   * NO `server_name _`. Same reason.
#   * NO `http2 on;`. That directive needs nginx >= 1.25.1 and this box runs
#     1.24.0, where it is a hard config error that would stop nginx reloading —
#     taking down all ten sites. The per-listener `http2` flag is also omitted
#     deliberately, matching the existing saleshandy-sslip vhost, so this block
#     never redefines protocol options on the shared :443 listener.
#   * `add_header` is per-block in nginx and replaces inherited headers, so
#     every location that sets one repeats the full set.
#
# Hostnames, both on one Let's Encrypt certificate:
#
#   leads.spiderhunts-coworkingspace.com  — the public one. An A record in the
#     company's Hostinger DNS zone points it here. Only that record was added;
#     the marketing site at the apex still serves from Hostinger and is
#     untouched.
#   leadportal.169-58-34-205.sslip.io     — kept deliberately. sslip.io resolves
#     any `<label>.169-58-34-205.sslip.io` to this box with no DNS records at
#     all, so it is the way back in if the spiderhunts zone is ever changed by
#     someone working on the marketing site. This box does not control that
#     zone.
#
# The certificate lineage on disk is still named after the sslip hostname,
# because that is the directory the cert already lives in and renaming it would
# point `ssl_certificate` below at nothing. nginx will not start with a missing
# `ssl_certificate`, and on this box that means all ten sites, not just this one.
#
# NOTE: IPv4 only, on purpose. Every site actually served from this box
# (leadquasar, spideychat, xiangqiplay) is A-record only, so inbound IPv6 here
# has never been exercised in production — and a client that resolves an AAAA
# prefers it, so an unverified one turns into a hang rather than a fallback.
# nginx still listens on [::] below, which costs nothing and means publishing an
# AAAA later is a DNS change plus a test, not a config change.

server {
    listen 80;
    listen [::]:80;
    server_name leads.spiderhunts-coworkingspace.com leadportal.169-58-34-205.sslip.io;

    # Renewal uses the shared webroot, same as the other sslip site.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leads.spiderhunts-coworkingspace.com leadportal.169-58-34-205.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/leadportal.169-58-34-205.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadportal.169-58-34-205.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # --- Access control ----------------------------------------------------
    # There is none here any more, and that is the point.
    #
    # This block used to carry `auth_basic "Lead Portal"` — one shared password
    # for everybody, because the application had no authentication of its own
    # and anyone who found the hostname could have driven the lead database
    # with a single curl. It was described here as a stopgap, and it was.
    #
    # The application now authenticates per person: sessions in Postgres,
    # ADMIN/AGENT roles checked server-side on every page and every API route
    # (see the README's Authentication section). Keeping Basic Auth as well
    # meant two prompts for one sign-in, and the first of them was a password
    # shared by the whole office that no one could revoke individually — the
    # exact property the real login exists to remove.
    #
    # /etc/nginx/leadportal.htpasswd is left on disk, unused. It costs nothing
    # there and it is what a rollback to a pre-auth release would need.

    # --- Security headers --------------------------------------------------
    add_header X-Content-Type-Options     "nosniff"                          always;
    add_header X-Frame-Options            "DENY"                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                      always;
    # The certificate is a real Let's Encrypt one, so HSTS is safe to send.
    # Scoped to this host only — no includeSubDomains, because the parent
    # 169-58-34-205.sslip.io is a different site on this same box and this
    # vhost has no business dictating its TLS policy.
    add_header Strict-Transport-Security  "max-age=31536000"                 always;
    # Next ships inline bootstrap scripts and next/font injects inline CSS, so
    # 'unsafe-inline' is required. 'unsafe-eval' is NOT — nothing here needs it.
    # Fonts are self-hosted by next/font, so no external origin is allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Compression -------------------------------------------------------
    # next.config.ts sets compress:false so this is the only place it happens.
    # text/html is always compressed by nginx and must not be listed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/manifest+json;

    # app/api/leads/upload/route.ts rejects >8MB with its own JSON 413. This is
    # set higher so that message is what the agent sees, rather than nginx's
    # default error page cutting the request off first.
    client_max_body_size 12M;
    client_body_timeout  120s;

    # --- Static assets: content-hashed, cacheable forever ------------------
    location /_next/static/ {
        proxy_pass http://leadportal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Health check ------------------------------------------------------
    # deploy.sh polls this before switching traffic, and it discloses nothing
    # but up/down. The application leaves it unauthenticated for that reason
    # (see lib/access.ts) — it is not exempted here.
    location = /api/health {
        proxy_pass http://leadportal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Scraper ingest ----------------------------------------------------
    # The caller is the Yelp scraper on another box, not a browser, so it has
    # no session cookie to send: it authenticates with the bearer token the
    # route itself checks (lib/ingestAuth.ts), and that route refuses every
    # request when INGEST_TOKEN is unset, so it cannot fall open. The
    # application's own session check exempts this exact path for the same
    # reason (lib/access.ts).
    #
    # Kept as its own location for the larger body size and longer timeouts
    # below, which a whole scraper output folder needs and no other route does.
    location = /api/leads/ingest {
        proxy_pass http://leadportal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A push is a whole output folder, not one hand-picked file. The route
        # rejects >32MB with its own JSON 413; this sits above that so that
        # message is what the scraper logs, not nginx's HTML error page.
        client_max_body_size 40M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # --- Call recording upload ---------------------------------------------
    # An agent posting the audio of a client call. The route rejects anything
    # over 25MB with its own JSON 413 (lib/recordingRules.ts); this sits above
    # that so the agent reads that message rather than nginx's error page.
    #
    # Anchored with `$` so it matches only the upload/metadata/delete endpoint.
    # Playback is `/recording/stream`, which falls through to `location /`
    # below — it needs none of this, since streaming sends no request body.
    #
    # This is a regex location, so it is matched before the `/` prefix and has
    # to restate the proxy headers; there is no inheritance between locations
    # for `proxy_set_header`.
    location ~ ^/api/meetings/[^/]+/recording$ {
        proxy_pass http://leadportal_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        client_max_body_size 30M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # --- Monitor installer download ----------------------------------------
    # The SpiderHunts Monitor Windows installer, ~77MB, streamed by the
    # application from /var/lib/leadportal/downloads to a signed-in agent
    # (app/api/downloads/monitor/route.ts). Authenticated inside the handler
    # like every other route here — this block changes how the bytes travel,
    # never who may have them.
    #
    # `proxy_buffering off` is the only reason this location exists. With
    # buffering on, nginx writes the whole 77MB into a proxy temp file before
    # the agent's browser sees a byte: the download appears to hang for several
    # seconds, the disk takes a copy of every download, and the file is large
    # enough to be worth not doing that for. Off, the response streams straight
    # through, which is what the handler is already doing on its side.
    #
    # Exact match, so only the download itself is affected. The metadata
    # endpoint (/api/downloads/monitor/info) is a few hundred bytes of JSON and
    # falls through to `location /` below, where buffering is the right default.
    #
    # No `client_max_body_size` here on purpose: nothing is ever uploaded to
    # this path. The route exports GET and nothing else, so any request with a
    # body is a 405 before its size matters.
    location = /api/downloads/monitor {
        proxy_pass http://leadportal_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        # A slow connection pulling 77MB must not be cut off part way. These are
        # per-operation, not total, so they are generous without letting an idle
        # socket sit forever.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Application -------------------------------------------------------
    location / {
        proxy_pass http://leadportal_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Empty Connection header is what actually enables upstream keepalive.
        proxy_set_header Connection        "";

        # A CSV import parses and writes the whole file within one request.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
